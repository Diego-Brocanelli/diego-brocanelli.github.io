{{- if not .IsHome -}}
<nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="{{ "/" | relURL }}">Home</a>

    {{- with .Section }}
    {{- with site.GetPage . }}
        <span aria-hidden="true"> / </span>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{- end }}
    {{- end }}

    <span aria-hidden="true"> / </span>
    <span>{{ .Title }}</span>
</nav>
{{- end -}}
