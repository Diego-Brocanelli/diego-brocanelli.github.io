<div id="utterances-container"></div>

<script>
(function () {
    function currentUtterancesTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark"
            ? "github-dark"
            : "github-light";
    }

    var container = document.getElementById("utterances-container");

    var script = document.createElement("script");
    script.src = "https://utteranc.es/client.js";
    script.setAttribute("repo", "diego-brocanelli/diego-brocanelli.github.io");
    script.setAttribute("issue-term", "pathname");
    script.setAttribute("theme", currentUtterancesTheme());
    script.crossOrigin = "anonymous";
    script.async = true;

    container.appendChild(script);

    // Envia o tema atual para o iframe do utterances (troca ao vivo, sem reload)
    function sendThemeToUtterances(theme) {
        var iframe = document.querySelector(".utterances-frame");
        if (!iframe) return;

        iframe.contentWindow.postMessage(
            { type: "set-theme", theme: theme },
            "https://utteranc.es"
        );
    }

    // Acompanha as trocas feitas no botão de tema do PaperMod
    var observer = new MutationObserver(function () {
        sendThemeToUtterances(currentUtterancesTheme());
    });

    observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"]
    });
})();
</script>
